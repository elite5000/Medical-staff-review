[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.139.2",
    "ortools>=9.15.6755",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pystray>=0.19.5",
    "qrcode>=8.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "types-qrcode>=8.2.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: X = Depends(...)`; B008 would otherwise
# flag every route handler in app/routers/.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions", "^dist/"]

[[tool.mypy.overrides]]
# No stubs/py.typed marker published for pystray.
module = "pystray.*"
ignore_missing_imports = true
